# /etc/nginx/sites-available/pcas-portal.conf
# Default host layout:
# - pcas-portal.atlascopco.group -> portal landing / login gate
# - eob.atlascopco.group         -> EOB frontend + backend API
# - oqc.atlascopco.group         -> OQC canonical host
# - sw-portal.atlascopco.group   -> Jarvis canonical host

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

server {
    listen 80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pcas-portal.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name eob.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:8004/api/;
    }

    location / {
        proxy_pass http://127.0.0.1:3004/;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name oqc.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;

    location / {
        proxy_pass https://oqc.atlascopco.group/;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sw-portal.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;

    location / {
        proxy_pass https://sw-portal.atlascopco.group/;
    }
}
