# /etc/nginx/sites-available/coolify.conf
# Generated by Engineering Resource Management Setup

# WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# SSL Shared Settings (Only essential ones that might not be in main nginx.conf)
ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# HTTP to HTTPS Redirect
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 1. Coolify (Main)
server {
    listen 443 ssl;
    server_name coolify.10.182.252.32.sslip.io VTISAZUAPP218 10.182.252.32 10.182.252.32.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

