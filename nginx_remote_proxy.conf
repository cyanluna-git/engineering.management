# /etc/nginx/sites-available/pcas-portal.conf
# Phase A default: pcas-portal.10.182.252.32.sslip.io + self-signed SSL
# Phase B cutover: change server_name and certificate paths only.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

server {
    listen 80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pcas-portal.10.182.252.32.sslip.io;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /eob {
        return 301 /eob/;
    }

    location = /oqc {
        return 301 /oqc/;
    }

    location = /jarvis {
        return 301 /jarvis/;
    }

    location /eob/api/ {
        proxy_pass http://127.0.0.1:8004/api/;
        proxy_set_header X-Forwarded-Prefix /eob/api;
    }

    location /eob/ {
        proxy_pass http://127.0.0.1:3004/;
        proxy_set_header X-Forwarded-Prefix /eob;
    }

    location /oqc/ {
        proxy_pass https://oqc.10.182.252.32.sslip.io/;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Prefix /oqc;
    }

    location /jarvis/ {
        proxy_pass https://jarvis.10.182.252.32.sslip.io/;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Prefix /jarvis;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl http2;
    server_name eob.10.182.252.32.sslip.io;

    return 301 https://pcas-portal.10.182.252.32.sslip.io/eob$request_uri;
}

server {
    listen 443 ssl http2;
    server_name oqc.10.182.252.32.sslip.io;

    return 301 https://pcas-portal.10.182.252.32.sslip.io/oqc$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jarvis.10.182.252.32.sslip.io;

    return 301 https://pcas-portal.10.182.252.32.sslip.io/jarvis$request_uri;
}
