# /etc/nginx/sites-available/coolify.conf
# Generated by Engineering Resource Management Setup
# Based on SERVER_SETUP.md configuration

# WebSocket support (Required for Coolify, Portainer, and Vite HMR)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. Coolify (Main & Default)
server {
    listen 80;
    server_name coolify.10.182.252.32.sslip.io VTISAZUAPP218 10.182.252.32 10.182.252.32.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

