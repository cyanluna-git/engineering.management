# /etc/nginx/sites-available/pcas-portal.conf
# Default host layout:
# - pcas-portal.atlascopco.group -> portal landing / login gate
# - eob.atlascopco.group         -> EOB frontend + backend API
# - oqc.atlascopco.group         -> OQC canonical host
# - sw-portal.atlascopco.group   -> Jarvis canonical host

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pcas-portal.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl;
    server_name eob.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api {
        proxy_pass http://127.0.0.1:8004;
    }

    location / {
        proxy_pass http://127.0.0.1:3004/;
    }
}

server {
    listen 443 ssl;
    server_name oqc.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api {
        proxy_pass http://127.0.0.1:8005;
    }

    location / {
        proxy_pass http://127.0.0.1:3005/;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name eob.10.182.252.32.sslip.io oqc.10.182.252.32.sslip.io;
    return 404;
}

server {
    listen 443 ssl;
    server_name sw-portal.atlascopco.group;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3009;
    }
}
