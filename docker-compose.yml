services:
  db:
    image: postgres:15
    container_name: edwards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-edwards}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - edwards_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edwards-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edwards}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004,http://eob.10.182.252.32.sslip.io}
      # SSL Cert for Zscaler
      SSL_CERT_FILE: "/usr/local/share/ca-certificates/zscaler.crt"
      REQUESTS_CA_BUNDLE: "/usr/local/share/ca-certificates/zscaler.crt"
    ports:
      - "${BACKEND_PORT:-8004}:8004"
    depends_on:
      - db
    volumes:
      # Mount Zscaler cert from project folder
      - ./backend/certs/zscaler.crt:/usr/local/share/ca-certificates/zscaler.crt:ro
      # Docker socket for container monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edwards_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_OQC_URL: ${VITE_OQC_URL:-}
        VITE_JARVIS_URL: ${VITE_JARVIS_URL:-}
        VITE_TESTRIG_URL: ${VITE_TESTRIG_URL:-}
    container_name: edwards-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3004}:80"
    depends_on:
      - backend
    networks:
      - edwards_net

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: pcas-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-10.182.252.32.sslip.io}
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    networks:
      - edwards_net

volumes:
  db_data:

networks:
  edwards_net:
