services:
  db:
    image: postgres:15
    container_name: edwards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-edwards}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - edwards_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edwards-api
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edwards}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3004,https://pcas-portal.atlascopco.group,https://eob.10.182.252.32.sslip.io}
      # Use the system CA bundle after update-ca-certificates merges public and custom roots.
      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
    ports:
      - "${BACKEND_PORT:-8004}:8004"
    depends_on:
      - db
    volumes:
      # Mount Zscaler cert from project folder
      - ./backend/certs/zscaler.crt:/usr/local/share/ca-certificates/zscaler.crt:ro
      # Docker socket for container monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edwards_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_APP_BASE: ${VITE_APP_BASE:-/}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_PORTAL_URL: ${VITE_PORTAL_URL:-https://pcas-portal.atlascopco.group}
        VITE_OQC_URL: ${VITE_OQC_URL:-https://oqc.atlascopco.group}
        VITE_JARVIS_URL: ${VITE_JARVIS_URL:-https://sw-portal.atlascopco.group}
        VITE_TESTRIG_URL: ${VITE_TESTRIG_URL:-}
    container_name: edwards-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3004}:80"
    depends_on:
      - backend
    networks:
      - edwards_net

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: pcas-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_EOB_URL: ${NEXT_PUBLIC_EOB_URL:-https://eob.10.182.252.32.sslip.io}
      NEXT_PUBLIC_OQC_URL: ${NEXT_PUBLIC_OQC_URL:-https://oqc.atlascopco.group}
      NEXT_PUBLIC_JARVIS_URL: ${NEXT_PUBLIC_JARVIS_URL:-https://sw-portal.atlascopco.group}
      PORTAL_OIDC_ENABLED: ${PORTAL_OIDC_ENABLED:-false}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
      PORTAL_OIDC_TENANT_ID: ${PORTAL_OIDC_TENANT_ID:-}
      PORTAL_OIDC_AUTHORITY: ${PORTAL_OIDC_AUTHORITY:-}
      PORTAL_OIDC_REDIRECT_URI: ${PORTAL_OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      PORTAL_OIDC_POST_LOGOUT_REDIRECT_URI: ${PORTAL_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/}
      PORTAL_OIDC_SCOPES: ${PORTAL_OIDC_SCOPES:-openid,profile,email,offline_access,User.Read}
      PORTAL_HANDOFF_SIGNING_KEY: ${PORTAL_HANDOFF_SIGNING_KEY:-}
      PORTAL_HANDOFF_TOKEN_EXPIRE_SECONDS: ${PORTAL_HANDOFF_TOKEN_EXPIRE_SECONDS:-120}
      GATEWAY_MODE_EOB: ${GATEWAY_MODE_EOB:-direct}
      GATEWAY_MODE_OQC: ${GATEWAY_MODE_OQC:-direct}
      GATEWAY_MODE_JARVIS: ${GATEWAY_MODE_JARVIS:-direct}
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    networks:
      - edwards_net

  edge-proxy:
    profiles:
      - edge-proxy
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pcas-edge-proxy
    restart: unless-stopped
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-pcas-portal.atlascopco.group}
      EOB_DOMAIN: ${EOB_DOMAIN:-eob.10.182.252.32.sslip.io}
      OQC_DOMAIN: ${OQC_DOMAIN:-oqc.atlascopco.group}
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:-sw-portal.atlascopco.group}
      OQC_UPSTREAM: ${OQC_UPSTREAM:-https://oqc.atlascopco.group/}
      JARVIS_UPSTREAM: ${JARVIS_UPSTREAM:-https://sw-portal.atlascopco.group/}
      NGINX_CERT_DOMAIN: ${PORTAL_DOMAIN:-pcas-portal.atlascopco.group}
      NGINX_SSL_CERT: /etc/nginx/ssl/nginx-selfsigned.crt
      NGINX_SSL_KEY: /etc/nginx/ssl/nginx-selfsigned.key
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    depends_on:
      - portal
      - frontend
      - backend
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - edwards_net

volumes:
  db_data:

networks:
  edwards_net:
