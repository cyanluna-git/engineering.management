# EOB CI/CD Pipeline
# CI (all branches): lint + validate
# CD (release only): lint + docker build + deploy to prod

definitions:
  caches:
    pip: ~/.cache/pip

  steps:
    # ── Lint & Validate ──
    - step: &lint-validate
        name: Lint & Validate
        runs-on:
          - self.hosted
          - linux.shell
        caches:
          - pip
        script:
          - echo "═══ Backend — syntax check ═══"
          - export DATABASE_URL="sqlite:///:memory:"
          - export SECRET_KEY="ci-test-secret-key-do-not-use-in-production"
          - cd backend
          - python3 -m venv .venv
          - .venv/bin/pip install --quiet -r requirements.txt
          - python3 -m compileall -q app/
          - .venv/bin/python3 -c "from app.main import app; print('Backend OK')"
          - cd ..
          - echo "═══ Frontend — TypeScript check ═══"
          - docker build --target build --build-arg VITE_APP_BASE=/ --build-arg VITE_API_URL=/api -t edwards_project-frontend:lint -f frontend/Dockerfile frontend
          - docker rmi edwards_project-frontend:lint
          - echo "═══ Lint & Validate complete ═══"

    # ── Docker Build (release only) ──
    - step: &docker-build
        name: Build Docker Images
        runs-on:
          - self.hosted
          - linux.shell
        script:
          - echo "═══ Building Docker images ═══"
          - echo "--- Backend image ---"
          - docker build -t edwards_project-backend:latest -f backend/Dockerfile backend
          - echo "--- Frontend image ---"
          - docker build --target production --build-arg VITE_APP_BASE=/ --build-arg VITE_API_URL=/api --build-arg VITE_PORTAL_URL=https://pcas-portal.atlascopco.group --build-arg VITE_OQC_URL=https://oqc.atlascopco.group --build-arg VITE_JARVIS_URL=https://sw-portal.atlascopco.group -t edwards_project-frontend:latest -f frontend/Dockerfile frontend
          - echo "═══ Docker build complete ═══"

    # ── Deploy to Prod ──
    - step: &deploy-prod
        name: Deploy to Production
        runs-on:
          - self.hosted
          - linux.shell
        script:
          - echo "═══ Deploying to Production ═══"
          - mkdir -p ~/.ssh
          - chmod 700 ~/.ssh
          - cp ~/.ssh/eob-deploy-key ~/.ssh/id_ed25519 2>/dev/null || true
          - chmod 600 ~/.ssh/id_ed25519 2>/dev/null || true
          - ssh-keyscan -H 10.182.252.32 >> ~/.ssh/known_hosts 2>/dev/null || true
          - ./scripts/deploy/full_deploy.sh --skip-backup
          - echo "═══ Production Deploy Complete ═══"

pipelines:
  # ── CI: All branches (lint only) ──
  default:
    - step: *lint-validate

  # ── CD: Release branch (lint + docker build + deploy) ──
  branches:
    release:
      - step: *lint-validate
      - step: *docker-build
      - step:
          <<: *deploy-prod
          name: Deploy to Production 🚀
          trigger: manual
